{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Money Managment Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-colors-highway.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{% static 'general.css' %}">
    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.5/jquery.min.js"></script>
    <script src="{% static 'budget_tool.js' %}"></script>
</head>
<body>


    {% include "base_nav.html" %}

    <!-- Expenses -->
    <section class="section-spacing section-padding">

        <!-- Form to add expenses -->
        <div>
            <br />
            <form id="expenseForm">
                <div>
                    <label for="expenseLabel">Expense Label:</label>
                    <br />
                    <input id="expenseLabel" class="form-input" type="text" name="expenseLabel" required />
                </div>

                <br />

                <div>
                    <label for="expenseCost">Amount:</label>
                    <br />
                    <input id="expenseCost" type="number" name="expenseCost" required />
                    <select id="expenseFrequency" name="expenseFrequency">
                        <option value="52">Weekly</option>
                        <option value="12" selected>Monthly</option>
                        <option value="1">Yearly</option>
                    </select>
                </div>

                <br />

                <button class="form-submit-height" onclick="SubmitAddExpense(event)">Add Expenses</button>
            </form>
        </div>

        <br />
        <!-- Tracking expenses -->
        <div id="monthlyExpenseContainer" class="hidden-content">
            <p>Monthly Expenses</p>
            <table>
                <tr>
                    <th>Label</th>
                    <th>Cost</th>
                </tr>

                <tr id="monthlyExpenseTemplate">
                    <td id="label"></td>
                    <td id="cost"></td>
                </tr>
            </table>

        </div>
    </section>

    {% include "base_footer.html" %}


</body>
</html>
