{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Money Managment Tool</title>
    <link rel="stylesheet" href="{% static 'calculator.css' %}">
    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.5/jquery.min.js"></script>
    <script src="{% static 'calculator.js' %}"></script>
</head>
<body>

    <!-- Calculator -->
    <section>
        <div>
            <form id="calculatorForm">
                <label for="income">Income:</label>
                <br>
                <input type="number" id="income" name="income" required>
                <select id="numPayments" name="numPayments" required>
                    <option value="1">Yearly</option>
                    <option value="26">Bi-weekly</option>
                    <option value="52">Weekly</option>
                    <option value="2080">Hourly (40hrs/week)</option>
                    <option value="1950">Hourly (37.5hrs/week)</option>
                    <option value="1820">Hourly (35hrs/week)</option>
                </select>
                <br>


                <label for="province">Province</label>
                <label for="year">Year</label>
                <br>

                <select id="province" name="province" required>
                    <option value="MB">Manitoba</option>
                    <option value="ON">Ontario</option>
                </select>

                <select id="year" name="year" required>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                </select>
                <br>

                <button onclick="calculatorSubmit()">Submit</button>
            </form>
        </div>
    </section>

     <!--Results from calculator--> 
    <section>
        <div id="calculatorResultTemplate" class="hidden-content">
            <button type="button" class="collapsible" onclick="collapsibleContent(this)">+</button>
            <div class="collapsible-content">
                <label>Post tax income:</label>
                <p id="postTaxIncomeYearly">/Year</p>
                <p id="postTaxIncomeBiWeekly">/Two Weeks</p>
                <p id="postTaxIncomeWeekly">/Week</p>
                <p id="postTaxIncome40Hours">/hr (40hrs a week)</p>
                <p id="postTaxIncome37.5Hours">/hr (37.5hrs a week)</p>
                <p id="postTaxIncome35Hours">/hr (35hrs a week)</p>

                <label>Provincial tax:</label>
                <p id="provincialTax"></p>

                <label>Federal tax:</label>
                <p id="federalTax"></p>
            </div>
        </div>
    </section>

</body>
</html>
